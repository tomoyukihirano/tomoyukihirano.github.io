schema_version: 1
confirmed_on: '2026-10-22'
review_batch:
  questions_from: 25
  questions_through: 72
presentation:
  classification_basis: nature_of_event_not_host_country
  conference_scope_options:
  - domestic
  - international
  separate_event_types:
  - seminar
  - exhibition_lecture
  separate_event_types_filter: all_presentations_only
  website_date_basis: conference_period
  individual_presentation_date_field: participation.presentation_date
  presenter_marker: false
  proceedings_only_reporting: include_as_presentation_without_special_label
  invitation_confirmation_applies_to: existing_records_at_review_date_only
  new_record_invitation_default: null
  reserved_retired_ids:
  - pres-0063
  ignored_award_record_ids:
  - pres-0038
  - pres-0067
  - pres-0089
  - pres-0061
  ignored_award_means: excluded_from_reporting_not_confirmed_absence_of_award
  excluded_import_candidates:
  - source: lab_website
    source_record_number: 359
    status: deferred_by_owner
publication_metrics:
  top10_percent:
    stored_field: classification.top10_percent
    level: article
    basis: citation_percentile
    threshold_percent: 10
    aggregation: any_assessed_field
    assessment_date: null
    assessment_year: null
    assessment_fields: null
    note: 論文被引用数に基づくTop10%です。雑誌順位ではありません。既存判定値は変更しません。
  journal_metrics_context: journals.metrics_context
internal_report:
  scope_selection: select_at_export
  default_scope: null
  presentation_scopes:
  - student_is_presenter
  - student_is_any_author
  publication_scopes:
  - student_is_first_author
  - student_is_any_author
  private_relationship_data_required: true
  private_records_in_public_build: false
  note: 出力時に条件を選択します。この設定は自動出力プログラムの実装完了を意味しません。
publication_metadata_maintenance:
  confirmed_on: '2026-10-23'
  metrics:
    fields: [impact_factor, jcr_quartile, top10_percent]
    refresh: only_when_requested_or_needed
    scheduled_refresh: false
    preserve_existing_values_until_reviewed: true
  dates:
    fields: [submitted, accepted, published_online]
    acquisition: check_when_adding_or_updating_a_publication
    scheduled_crawl: false
    preferred_evidence: publisher_article_history_or_official_article_pdf
    distinguish_first_online_from_issue_publication: true
    record_source_url_and_checked_on: true
    verification_records: publication_date_reviews.yml
    existing_dates_basis: owner_supplied_bibliographic_records
    missing_values: do_not_infer
    conflicting_values: retain_original_and_hold_public_date
    display: supplementary_line_below_each_journal_article
    display_language: en
    display_labels: {submitted: Submitted, accepted: Accepted, published_online: Published Online}
    display_format: 'MMMM DD, YYYY'
    storage_format: YYYY-MM-DD
    missing_label: N/A
    conflict_label: N/A
    unavailable_label_meaning: not_available_or_awaiting_verification
    preserve_internal_verification_status: true
  accepted_fiscal_year:
    computation: derive_from_accepted_date_only_when_requested
    method: Python
    fiscal_year_start_month: 4
    display_on_website: false
    existing_stored_values: preserve_for_traceability_do_not_treat_as_authoritative
  note: 更新時の確認方針です。定期収集の自動実行を設定したことや，全論文の日付を再検証済みであることを意味しません。
