<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平野の予定 | Hirano Schedule</title>

<link rel="stylesheet" href="../assets/css/exported/page-style-8bcf730cc6c9.css">
</head>

<body>

<!-- 言語切替 -->
<div class="language-switch">
  <button type="button" id="btn-ja" class="language-button active" onclick="changeLanguage('ja')">
    日本語
  </button>

  <button type="button" id="btn-en" class="language-button" onclick="changeLanguage('en')">
    English
  </button>
</div>

<!-- タイトル -->
<h1 id="schedule-title">平野の予定</h1>

<!-- 研究室の予定へのリンク -->
<nav class="page-navigation">
  <a id="page-link" href="../schedule-lab/">
    研究室の予定はこちら →
  </a>
</nav>

<!-- ログイン案内 -->
<div class="login-area">

  <p id="instructions"></p>

  <a id="login-button" href="https://accounts.google.com/Logout" target="_blank" rel="noopener noreferrer">

    <span id="button-main" class="button-main">
      カレンダーが表示されない場合に押すボタン
    </span>

    <span id="button-sub" class="button-sub">
      （研究室用Googleアカウントを選択してください）
    </span>

  </a>

</div>

<!-- Googleカレンダー -->
<iframe id="hirano-calendar" title="Hirano Availability Calendar" scrolling="no">
</iframe>

<script>
/* 平野の共有カレンダー */
const calendarId =
  "OTJjNDFmNTg1NWMyYzJlMzExMWI0YTkzNDM5NDU4NTM2YjVkY2FkYTliYjk0OWY0NTBjNGFlZmU4YTg5MWM0Y0Bncm91cC5jYWxlbmRhci5nb29nbGUuY29t";

function changeLanguage(lang) {

  document.documentElement.lang = lang;

  const title =
    document.getElementById("schedule-title");

  const pageLink =
    document.getElementById("page-link");

  const instructions =
    document.getElementById("instructions");

  const buttonMain =
    document.getElementById("button-main");

  const buttonSub =
    document.getElementById("button-sub");

  const calendar =
    document.getElementById("hirano-calendar");

  if (lang === "ja") {

    title.textContent = "平野の予定";
    pageLink.textContent = "研究室の予定はこちら →";

    instructions.innerHTML = `
      カレンダーが表示されない場合，下のボタンを押してから，<br>
      研究室用Googleアカウントで最初にログインして，<br>
      このページに戻って再読み込みしてください。
    `;

    buttonMain.textContent =
      "カレンダーが表示されない場合に押すボタン";

    buttonSub.textContent =
      "（研究室用Googleアカウントを選択してください）";

  } else {

    title.textContent =
      "Hirano Availability Schedule";

    pageLink.textContent =
      "View Lab Schedule →";

    instructions.innerHTML = `
      If the calendar is not displayed,
      click the button below.<br>
      Sign in first with your
      lab Google account,<br>
      then return to this page and refresh it.
    `;

    buttonMain.textContent =
      "Click here if the calendar is not displayed";

    buttonSub.textContent =
      "(Select your lab Google account)";
  }

  /* ページ移動時も言語を維持 */
  pageLink.href =
    "../schedule-lab/?lang=" + lang;

  /* Googleカレンダー表示 */
  const url = new URL(
    "https://calendar.google.com/calendar/embed"
  );

  url.searchParams.set("height", "600");
  url.searchParams.set("wkst", "2");
  url.searchParams.set("bgcolor", "#ffffff");
  url.searchParams.set("ctz", "Asia/Tokyo");
  url.searchParams.set("mode", "WEEK");
  url.searchParams.set("src", calendarId);
  url.searchParams.set("hl", lang);

  if (calendar.src !== url.href) {
    calendar.src = url.href;
  }

  document.getElementById("btn-ja")
    .classList.toggle("active", lang === "ja");

  document.getElementById("btn-en")
    .classList.toggle("active", lang === "en");
}

/* 初期言語 */
const initialLang =
  new URLSearchParams(location.search).get("lang") === "en"
    ? "en" : "ja";

changeLanguage(initialLang);
</script>

</body>
</html>
