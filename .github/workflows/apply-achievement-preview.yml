name: Build achievement-page preview

on:
  push:
    branches:
      - preview/achievement-pages-20261022
    paths:
      - .github/workflows/apply-achievement-preview.yml
      - _maintenance/apply_achievement_preview.py.xz.b64

permissions:
  contents: write
  pages: read

jobs:
  build-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install transformation dependencies
        run: python -m pip install --disable-pip-version-check ruamel.yaml==0.18.15 beautifulsoup4==4.14.2

      - name: Decode and apply reviewed transformation
        run: |
          base64 --decode _maintenance/apply_achievement_preview.py.xz.b64 | xz --decompress > /tmp/apply_achievement_preview.py
          python /tmp/apply_achievement_preview.py

      - name: Verify structured data and changed-file scope
        run: |
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML
          import subprocess

          yaml = YAML(typ='safe')
          presentations = []
          for path in sorted(Path('_data/presentations').glob('*.yml')):
              presentations.extend((yaml.load(path.read_text(encoding='utf-8')) or {}).get('records', []))
          publications = []
          for path in sorted(Path('_data/publications').glob('*.yml')):
              publications.extend((yaml.load(path.read_text(encoding='utf-8')) or {}).get('records', []))
          grants = (yaml.load(Path('_data/grants.yml').read_text(encoding='utf-8')) or {}).get('records', [])

          assert len(presentations) == 101, len(presentations)
          assert len({r['id'] for r in presentations}) == 101
          assert sum((r.get('classification') or {}).get('scope') == 'domestic' for r in presentations) == 79
          assert sum((r.get('classification') or {}).get('scope') == 'international' for r in presentations) == 22
          assert sum(bool((r.get('classification') or {}).get('invited')) for r in presentations) == 6
          assert all((r.get('display_html') or '').count('〇') == 1 for r in presentations)
          assert len(publications) == 78
          assert len({r['id'] for r in publications}) == 78
          assert all(r.get('display_html') for r in publications)
          assert len(grants) == 19
          assert sum(r.get('publish') is not False for r in grants) == 18

          expected = {
              'EDITING.md', '_data/README.md', '_data/grants.yml',
              '_includes/grant-group.html', '_includes/presentation-year.html', '_includes/publication-year.html',
              'assets/site.css', 'assets/site.js', 'presentations.md', 'publications.md', 'supports-grants.md',
          }
          expected.update(f'_data/presentations/{year}.yml' for year in range(2018, 2027))
          expected.update(f'_data/publications/{year}.yml' for year in range(2018, 2027))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = changed - expected
          missing = expected - changed
          assert not unexpected, f'Unexpected changes: {sorted(unexpected)}'
          assert not missing, f'Expected changes missing: {sorted(missing)}'
          print({'presentations': len(presentations), 'publications': len(publications), 'grants': len(grants)})
          PY

      - name: Set up Pages build
        uses: actions/configure-pages@v5

      - name: Build preview with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site_preview

      - name: Verify rendered pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          p = BeautifulSoup(Path('_site_preview/presentations/index.html').read_text(encoding='utf-8'), 'html.parser')
          pub = BeautifulSoup(Path('_site_preview/publications/index.html').read_text(encoding='utf-8'), 'html.parser')
          g = BeautifulSoup(Path('_site_preview/supports-grants/index.html').read_text(encoding='utf-8'), 'html.parser')
          assert p.select_one('[data-filter-kind="presentation"]')
          assert len(p.select('[data-achievement-item]')) == 101
          assert len(p.select('.achievement-badge-invited')) == 6
          assert '火炎を用いた微粒子材料の高機能化' in p.get_text(' ', strip=True)
          assert pub.select_one('[data-filter-kind="publication"]')
          assert len(pub.select('[data-achievement-item]')) == 78
          assert '旭硝子財団' not in g.get_text(' ', strip=True)
          assert '粉体工学情報センター' in g.get_text(' ', strip=True)
          print('Rendered-page checks passed.')
          PY

      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: achievement-pages-preview
          path: ./_site_preview
          retention-days: 7

      - name: Remove temporary transformation machinery
        run: |
          rm -f _maintenance/apply_achievement_preview.py.xz.b64
          rmdir _maintenance 2>/dev/null || true
          rm -f .github/workflows/apply-achievement-preview.yml
          rm -f .github/workflows/export-preview-worktree.yml

      - name: Commit reviewed preview changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare filtered achievement pages from structured data'
          git push origin HEAD:preview/achievement-pages-20261022
