name: Validate Markdown migration

on:
  push:
    branches:
      - migration/markdown-phase1
      - migration/markdown-pages

permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-migration-preview
          path: ./_site
