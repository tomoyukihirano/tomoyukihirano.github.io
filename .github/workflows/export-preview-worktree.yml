name: Export preview worktree

on:
  push:
    branches:
      - preview/achievement-pages-20261022

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package worktree
        run: tar --exclude=.git -czf /tmp/hirano-site-worktree.tar.gz .
      - name: Upload worktree
        uses: actions/upload-artifact@v4
        with:
          name: hirano-site-worktree
          path: /tmp/hirano-site-worktree.tar.gz
          retention-days: 3
