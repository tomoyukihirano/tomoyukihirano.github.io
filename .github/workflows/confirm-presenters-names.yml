name: Confirm presentation presenters and Japanese names

on:
  push:
    branches:
      - data/presenters-names-20261022
    paths:
      - _maintenance/confirm_presenters_and_names.py
      - .github/workflows/confirm-presenters-names.yml

permissions:
  contents: write
  pages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Build baseline
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_baseline
      - name: Apply owner-confirmed corrections
        run: python _maintenance/confirm_presenters_and_names.py
      - name: Build corrected presentation list
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify data preservation and exact HTML changes
        run: python _maintenance/confirm_presenters_and_names.py --verify
      - name: Commit validated changes to review branch only
        env:
          REVIEW_BRANCH: ${{ github.ref_name }}
        run: |
          test "$REVIEW_BRANCH" = "data/presenters-names-20261022"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/people.yml _data/presentations _data/README.md _includes/presentation-list.html EDITING.md
          git commit -m "Confirm first-author presenters, remove displayed presenter marks, and normalize approved Japanese names"
          git push origin "HEAD:$REVIEW_BRANCH"
          git rev-parse HEAD > _presenter_name_commit.txt
      - name: Save validation report
        uses: actions/upload-artifact@v4
        with:
          name: presenter-name-audit
          path: |
            _presenter_name_audit.json
            _presenter_name_commit.txt
          retention-days: 7
