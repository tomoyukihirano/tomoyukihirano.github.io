name: Apply confirmed author identities round 2
on:
  push:
    branches:
      - data/confirmed-identities-round2-20261022
    paths:
      - .github/workflows/apply-confirmed-round2.yml
      - _maintenance/merge_confirmed_round2.py
permissions:
  contents: write
  pages: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Build baseline HTML
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_baseline
      - name: Apply and validate owner-confirmed identities
        run: python _maintenance/merge_confirmed_round2.py
      - name: Build corrected data
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_after
      - name: Verify all generated HTML pages are unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          baseline = {p.relative_to('_baseline'): p.read_bytes() for p in Path('_baseline').rglob('*.html')}
          after = {p.relative_to('_after'): p.read_bytes() for p in Path('_after').rglob('*.html')}
          assert baseline and baseline == after, 'Generated HTML changed'
          report_path = Path('/tmp/identity-round2-report.json')
          report = json.loads(report_path.read_text())
          report['unchanged_html_pages'] = len(baseline)
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Commit data changes to review branch only
        run: |
          test "$GITHUB_REF_NAME" = data/confirmed-identities-round2-20261022
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/people.yml _data/README.md _data/publications/2021.yml _data/publications/2022.yml _data/publications/2023.yml
          git commit -m 'Unify confirmed Annie Rahmatika and Asep Nandiyanto identities; preserve imported names'
          git push origin HEAD:refs/heads/data/confirmed-identities-round2-20261022
